[package]
name = "dmm-cli"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI tool for USB and Bluetooth digital multimeters"

[[bin]]
name = "dmm-cli"
path = "src/main.rs"

[dependencies]
dmm-lib = { path = "../dmm-lib" }
dmm-shared = { path = "../dmm-shared" }
clap.workspace = true
clap_complete.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] } # `get --format json` leads with the header fields
ctrlc = "3"
log.workspace = true
console = "0.16"
serde-saphyr.workspace = true
csv.workspace = true
fluent-syntax = "0.12.0" # the capture instruction files; already in the tree for fluent-bundle
# `mcp`: the official Model Context Protocol SDK, which follows the spec's
# revisions; tokio is its runtime, already in the tree for Bluetooth.
rmcp = { version = "3.11", default-features = false, features = ["server", "macros", "transport-io"], optional = true }
tokio = { version = "1", features = ["rt", "io-std"], optional = true }

[features]
default = ["mcp"]
# The `mcp` command. Without it rmcp and the crates it brings are not built in.
mcp = ["dep:rmcp", "dep:tokio"]

# Embeds the icon Explorer shows for dmm-cli.exe (build.rs).
[build-dependencies]
winresource = { version = "0.1", default-features = false }

[dev-dependencies]
dmm-shared = { path = "../dmm-shared", features = ["test-support"] }
dmm-lib = { path = "../dmm-lib", features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
